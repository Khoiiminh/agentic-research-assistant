services:
  qdrant:
    image: qdrant/qdrant:v1.12.6
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  py-embed:
    build:
      context: ./embedding-sidecar
    ports:
      - "8089:8089"
    environment:
      - MODEL_NAME=BAAI/bge-m3
      - DEVICE=cpu
      - MAX_BATCH_SIZE=32
      # MODIFIED: Cache HF model artifacts outside the image
      - HF_HOME=/models
      - TRANSFORMERS_CACHE=/models
    volumes:
      - hf_models:/models
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8089/health').read()\""]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  qdrant_storage:
  hf_models:
